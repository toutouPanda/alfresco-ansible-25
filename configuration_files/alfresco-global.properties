# ---------------------------------------------------------------------------
# Raw alfresco-global.properties snippet.
# Assembled AFTER the properties generated by the repository role, so anything
# set here wins over the playbook defaults.
# ---------------------------------------------------------------------------

# --- Microsoft SQL Server -------------------------------------------------
# SNAPSHOT isolation (Connection.TRANSACTION_SNAPSHOT of the MS JDBC driver).
# Requires "ALTER DATABASE <db> SET ALLOW_SNAPSHOT_ISOLATION ON" on the server.
db.txn.isolation=4096
db.pool.max=275
